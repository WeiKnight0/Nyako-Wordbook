[package]
name = "nyako-wordbook"
version = "0.1.0"
edition = "2021"
default-run = "nyako-wordbook"
license = "MIT"

[lib]
name = "nyako_wordbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
benchmark = []
acceptance = []

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmark"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup", "functions"] }
unicode-normalization = "0.1"
fsrs = "=6.6.2"
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
tauri-plugin-single-instance = "=2.4.0"
calamine = "=0.37.0"
rust_xlsxwriter = "=0.102.0"
csv = "1.4.0"
encoding_rs = "0.8.44"
fs2 = "0.4.3"
tauri-plugin-dialog = "2.8.4"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
