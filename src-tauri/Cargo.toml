[package]
name = "nyako-wordbook"
version = "0.1.0"
edition = "2021"
default-run = "nyako-wordbook"
license = "MIT"

[lib]
name = "nyako_wordbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
benchmark = []
acceptance = []

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmark"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
unicode-normalization = "0.1"
fsrs = "=6.6.2"
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
tauri-plugin-single-instance = "=2.4.0"

[dev-dependencies]
tempfile = "3"
