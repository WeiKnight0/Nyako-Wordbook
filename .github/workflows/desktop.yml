name: Desktop validation
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to rebuild and publish, such as v0.1.0 (leave empty for validation)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  rules:
    if: >-
      (github.event_name == 'pull_request' && contains(fromJSON('["main","dev"]'), github.head_ref)) ||
      (github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
        (inputs.release_tag == '' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.policy.outputs.package }}
      publish: ${{ steps.policy.outputs.publish }}
      release_tag: ${{ steps.policy.outputs.release_tag }}
      commit: ${{ steps.policy.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Validate build and release policy
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          package=false
          publish=false
          if [[ "$EVENT_NAME" != 'pull_request' && "$BUILD_REF" == 'refs/heads/main' ]]; then
            package=true
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            test "v${version}" = "$RELEASE_TAG"
            test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
            git merge-base --is-ancestor HEAD origin/main
            package=true
            publish=true
          fi
          printf 'package=%s\npublish=%s\nrelease_tag=%s\ncommit=%s\n' "$package" "$publish" "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: rules
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rules.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm test
      - run: npm run test:rust -- --locked
      - name: Compile desktop
        if: needs.rules.outputs.package != 'true'
        run: npm run desktop:build -- --ci --no-bundle
      - name: Package desktop
        if: needs.rules.outputs.package == 'true'
        run: npm run desktop:build -- --ci
      - uses: actions/upload-artifact@v4
        if: needs.rules.outputs.package == 'true'
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
  release:
    if: needs.rules.outputs.publish == 'true'
    needs: [rules, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          count=$(find release-assets -type f | wc -l)
          test "$count" -ge 3
          test "$(find release-assets -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.dmg' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.deb' | wc -l)" -ge 1
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.rules.outputs.release_tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0)
          test "${#assets[@]}" -ge 3
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "NyakoWordbook $RELEASE_TAG" --generate-notes --verify-tag
          fi
